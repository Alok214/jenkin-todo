name: CI → Build → Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: todo-api
  CONTAINER_NAME: todo-api
  HOST_PORT: 8000

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Test — ❌ failure STOPS pipeline
  # ─────────────────────────────────────────────
  test:
    name: "Checkout → Run pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest (STOP on failure)
        run: |
          mkdir -p test-results
          pytest -v --junitxml=test-results/junit.xml
          # No "|| true" → failure stops workflow

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml

  # ─────────────────────────────────────────────
  # Job 2: Build → Remove → Deploy → Health Check
  # Only runs if test PASSED (needs: test)
  # ─────────────────────────────────────────────
  deploy:
    name: "Docker Build → Deploy → Health Check"
    runs-on: ubuntu-latest
    needs: test  # ← ❌ Test failure = this job never runs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build
        run: |
          echo "=== Docker Build ==="
          docker build -t $IMAGE_NAME:${{ github.run_number }} .
          docker tag $IMAGE_NAME:${{ github.run_number }} $IMAGE_NAME:latest
          docker images $IMAGE_NAME:${{ github.run_number }}

      - name: Remove Old Container
        run: |
          echo "=== Remove Old Container ==="
          docker stop $CONTAINER_NAME || true
          docker rm -f $CONTAINER_NAME || true
          docker compose down || true
          echo "✅ Old container cleaned"

      - name: Deploy New Container
        run: |
          echo "=== Deploy New Container ==="
          # Use compose if available, else docker run
          if [ -f "docker-compose.yml" ]; then
            IMAGE_TAG=${{ github.run_number }} HOST_PORT=$HOST_PORT docker compose up -d --build
            docker compose ps
          else
            docker run -d --name $CONTAINER_NAME -p $HOST_PORT:8000 --restart unless-stopped $IMAGE_NAME:latest
            docker ps | grep $CONTAINER_NAME
          fi

      - name: Health Check
        run: |
          echo "=== Health Check ==="
          echo "Waiting 10s for app..."
          sleep 10
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i: curl http://localhost:$HOST_PORT/health"
            if curl -f --silent http://localhost:$HOST_PORT/health; then
              echo ""
              echo "✅ Health check PASSED"
              curl -s http://localhost:$HOST_PORT/health
              echo ""
              docker ps | grep $CONTAINER_NAME || docker compose ps || true
              echo "🎉 SUCCESS"
              exit 0
            fi
            echo "⏳ Not ready, retry in 5s..."
            sleep 5
          done
          echo "❌ Health check FAILED"
          docker logs $CONTAINER_NAME || docker compose logs --tail=100 || true
          exit 1

      - name: Show deploy success
        if: success()
        run: echo "🚀 App running at http://localhost:$HOST_PORT → SUCCESS"
