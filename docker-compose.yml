services:
  todo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo-api:${IMAGE_TAG:-latest}
    container_name: todo-api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
